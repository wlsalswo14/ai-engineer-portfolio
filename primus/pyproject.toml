[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primus-lopvolution"
version = "1.0.0"
description = "Domain-separated harness evolution with independent certification."
requires-python = ">=3.11"

[project.optional-dependencies]
chess = ["python-chess==1.999"]
test = ["pytest>=8"]

[project.scripts]
primus = "primus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
